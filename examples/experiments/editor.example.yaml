# Minimal editor example. All optional task.parameters, search and stop settings
# are annotated in benchmark.example.yaml in this directory, under Editor/I.
schema_version: 1
task:
  source: editor
  material: editor-study
  parameters:
    inner_strategy: simple
# Install the editor-study material and independent task packages first.
# The source declares larger model/execution defaults; check before live use.
# Both roles explicitly use the entry provided by default-models.example.yaml.
# Change these names if your workspace catalog uses different entries.
models:
  editor: deepseek-flash-openai    # Proposes candidate changes.
  assessor: deepseek-flash-openai  # Model-based assessment when needed.
