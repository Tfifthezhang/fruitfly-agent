# Requires installed editor-study material with private comparison episodes.
baseline:
  config: default-config.yaml
  profile: baseline
tasks:
  file: tasks/editor.yaml
comparison:
  file: comparison.yaml
edit:
  improvement-editor:
    fields:
    - parameters.instructions.propose
    - parameters.instructions.invariant
    - parameters.instructions.domain
    - parameters.instructions.compose
budget:
  max_model_calls: 512
  max_executions: 256
  timeout_seconds: 10800
trial:
  operation_timeout_seconds: 1200
