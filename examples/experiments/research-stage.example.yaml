# Independent stages; only next.stage is executed. Paths resolve from this file.
# Model roles and algorithm instructions belong to the referenced system profile.
# Input files and named outputs must exist before their stage is selected.
research:
  id: retained-research
  title: Retained batch research
  output_root: ./research-output
  branch: main
baseline:
  config: ../configuration/default-config.example.yaml
  profile: baseline
stages:
  import:
    source: eval
    path: /path/to/completed-eval
    attempt: reuse
    publish_as: original-batch
  organize:
    incremental:
      enabled: true
      reuse: true
    delegation:
      enabled: true
      workers: [evidence-reader, record-organizer, cross-record-reader, counterexample-reader]
    inputs:
      batches: [{artifact: original-batch}]
    publish_as: organized-evidence
    instruction: Organize the supplied batch for readable, traceable inspection.
    allowance:
      seconds: 1200
      evidence_characters: 256000
      evidence_responses: 64
    attempt: reuse
  assess:
    delegation:
      enabled: true
      workers: [evidence-reader, record-organizer, cross-record-reader, counterexample-reader]
    inputs:
      batches: [{artifact: original-batch}]
      evidence: [{artifact: organized-evidence}]
    publish_as: original-assessment
    allowance:
      seconds: 1200
      evidence_characters: 256000
      evidence_responses: 64
    attempt: reuse
  propose:
    delegation:
      enabled: true
      workers: [evidence-reader, record-organizer, cross-record-reader, counterexample-reader]
    inputs:
      batches: [{artifact: original-batch}]
      evidence: [{artifact: organized-evidence}]
      assessments: [{artifact: original-assessment}]
    publish_as: candidate-a
    direction: Improve the enabled mechanisms using supplied observations.
    optimization:
      scope: defaults
      include: {}
      exclude: []
    allowance:
      seconds: 1200
      evidence_characters: 256000
      evidence_responses: 64
    attempt: reuse
  execute:
    inputs:
      harness: {candidate: candidate-a}
    publish_as: candidate-a-results
    tasks:
      file: /path/to/tasks.yaml
    allowance:
      task_seconds: 3600
    attempt: reuse
  compare:
    delegation:
      enabled: true
      workers: [evidence-reader, record-organizer, cross-record-reader, counterexample-reader]
    inputs:
      batches: [{artifact: original-batch}, {artifact: candidate-a-results}]
    publish_as: candidate-a-comparison
    allowance:
      seconds: 1200
      evidence_characters: 256000
      evidence_responses: 64
    attempt: reuse
next:
  stage: import
