# Source and task paths are placeholders. Model stages incur charges.
research:
  id: large-batch-research
  title: Large retained batch research
  output_root: ./research-output
  branch: main
baseline:
  config: runtime.example.yaml
  profile: baseline
stages:
  import:
    source: eval
    path: /path/to/completed-eval
    attempt: reuse
    publish_as: original-batch
  organize:
    incremental:
      enabled: true
      reuse: true
    delegation:
      enabled: true
      workers:
      - evidence-reader
      - record-organizer
      - cross-record-reader
      - counterexample-reader
    inputs:
      batches:
      - artifact: original-batch
    publish_as: organized-evidence
    instruction: Investigate up to three cross-task questions. Start with two or three
      relevant cases and available counterexamples per question. Use deterministic
      statistics, save sourced findings, then validate and submit a concise guide.
      Record unresolved questions as needs_evidence. Expand only to resolve a
      contradiction that changes a finding.
    allowance:
      seconds: 1800
      evidence_characters: 512000
      evidence_responses: 128
    attempt: reuse
  assess:
    delegation:
      enabled: true
      workers:
      - evidence-reader
      - record-organizer
      - cross-record-reader
      - counterexample-reader
    inputs:
      batches:
      - artifact: original-batch
      evidence:
      - artifact: organized-evidence
    publish_as: original-assessment
    allowance:
      seconds: 1200
      evidence_characters: 256000
      evidence_responses: 64
    attempt: reuse
  propose:
    delegation:
      enabled: true
      workers:
      - evidence-reader
      - record-organizer
      - cross-record-reader
      - counterexample-reader
    inputs:
      batches:
      - artifact: original-batch
      evidence:
      - artifact: organized-evidence
    publish_as: candidate-a
    direction: Improve the enabled mechanisms using supplied observations.
    optimization:
      scope: defaults
      include: {}
      exclude: []
    allowance:
      seconds: 86400
      evidence_characters: 536870912
      evidence_responses: 16384
    attempt: reuse
  execute:
    inputs:
      harness:
        candidate: candidate-a
    publish_as: candidate-a-results
    tasks:
      file: /path/to/tasks.yaml
    allowance:
      task_seconds: 3600
    attempt: reuse
  compare:
    delegation:
      enabled: true
      workers:
      - evidence-reader
      - record-organizer
      - cross-record-reader
      - counterexample-reader
    inputs:
      batches:
      - artifact: original-batch
      - artifact: candidate-a-results
    publish_as: candidate-a-comparison
    allowance:
      seconds: 1200
      evidence_characters: 256000
      evidence_responses: 64
    attempt: reuse
next:
  stage: import
