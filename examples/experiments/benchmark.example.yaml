# Benchmark recipe. Edit component values under components/; this file grants changes.
baseline:
  config: default-config.yaml
  profile: baseline
tasks:
  file: tasks/tb4-smoke.yaml
comparison:
  file: comparison.yaml
edit:
  base_prompt:
    fields:
    - parameters.text
  execution-policy:
    fields:
    - parameters.max_tool_calls_per_turn
    bounds:
      parameters.max_tool_calls_per_turn:
        minimum: 64
        maximum: 256
budget:
  timeout_seconds: 10800
trial:
  operation_timeout_seconds: 3600
  model_calls: 80
  concurrency: 1
  attempts: 1
