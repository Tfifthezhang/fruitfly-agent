baseline:
  config: default-config.yaml
  profile: baseline
tasks:
  file: tasks/tb4-smoke.yaml
comparison:
  file: comparison.yaml
edit:
  base_prompt:
    fields:
    - parameters.instructions.system
  execution-policy:
    fields:
    - parameters.settings.tool_execution.max_parallel
    bounds:
      parameters.settings.tool_execution.max_parallel:
        minimum: 1
        maximum: 16
trial:
  concurrency: 1
  attempts: 1
timeouts:
  editor_seconds: 1200
  execution_seconds: 3600
  evaluator_seconds: 1200
