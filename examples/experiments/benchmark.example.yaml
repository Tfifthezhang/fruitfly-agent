# Complete experiment reference. Copy to WORKSPACE/.fruitfly/experiment.yaml.
# Active values preserve built-in defaults; commented recipes are disabled.
# Replace sections when choosing recipes; do not create duplicate YAML keys.
# Settings do not launch work: choose eval, improvement or rsi at the CLI.
# check is offline; run uses models and may incur charges. No secrets belong here.
# Paths resolve from this YAML unless another owning file says otherwise.
schema_version: 1

task:
  source: eval                   # Choices: eval | files | editor | task-set; choose one.
  request: ../request.json        # Benchmark, variant, executor/profile, attempts, timeout.
  host: ../host.yaml              # Linux runtime, mounts, task data, cache, preparation.
  model_calls: 80                 # Per task execution, 1..10000; not the search total.
  # Benchmark Improvement needs one prepared task, one attempt, concurrency 1.
  # Run eval prepare after relevant runtime/host changes.
  # Official grading is task-owned; models.assessor does not replace it.

# Native sources only: replace runtime with the commented mapping if needed.
# Eval requires an empty mapping; its request owns runtime settings.
runtime: {}
# runtime:
#   config: default-config.yaml   # Omission: WORKSPACE/.fruitfly/default-config.yaml.
#   profile: baseline             # Harness profile; omission: config's default_profile.

models:
  # Catalog entry names, not remote model IDs. Add entries in default-models.yaml.
  # Roles may use one model; they remain separate services and contexts.
  editor: deepseek-flash-openai   # Generates candidates/compositions/reflections.
  assessor: deepseek-flash-openai # Read-only model judgments when requested.
  # executor: deepseek-flash-openai  # Native sources only; rejected for Eval.
  # Eval executor: request -> Agent config -> profiles.<profile>.model.profile.
  # Remove editor/assessor to inherit the Agent profile's auxiliary choice,
  # or its executor when no auxiliary choice exists. Fixed Eval ignores them.

improvement:
  # Optional structured H edits: add execution-policy to components, then enable:
  # component_options:
  #   execution-policy:
  #     editable_fields: [max_tool_calls_per_turn]
  #     bounds:
  #       max_tool_calls_per_turn: {minimum: 32, maximum: 512}
  # Configured components must exist and be supported by every selected backend.
  # Enabled mechanisms define availability; only components explicitly selected may change.
  strategy: simple               # Choices: simple | harness2.
  generator: agent-editor-v1      # Only CLI generator; others need Python registration.

  # Editable allowlist: one or several compatible H/S components.
  # H = harness instructions; S = retained documents; I = editor instructions.
  # Enable each owning tool/mechanism in default-config.yaml first.
  components:
    - base_prompt                # H: always available.
    # - tool-guidance.read       # H: requires enabled read tool.
    # - tool-guidance.write      # H: requires enabled write tool.
    # - tool-guidance.edit       # H: requires enabled edit tool.
    # - tool-guidance.bash       # H: TB runner supports Bash; native files do not.
    # - tool-guidance.ipython    # H: needs a runner with IPython capability.
    # - tool-guidance.web_search # H: needs a runner with web_search capability.
    # - tool-guidance.web_fetch  # H: needs a runner with web_fetch capability.
    # - execution-workflow      # H: enable execution-workflow; bounded stage text.
    # - skill-catalog.guidance  # H: enable skill-catalog; catalog guidance only.
    # - skill-document          # S: enable skill-document; one retained Skill body.
    # - learned-memory          # S: enable learned-memory; one retained memory body.
    # - improvement-editor      # I: ONLY item; task.source must be editor.
  # General slot: tool-guidance.<enabled-tool-name>; runner support is required.
  # Web/IPython guidance needs a compatible runner, not just an enabled tool.
  # Arbitrary source edits, code deployment and live replacement are not CLI options.

  rounds: 1                      # 1..10; simple: one candidate per round after baseline.
  mode: parallel                 # Choices: parallel | sequential; simple requires parallel.
  width: 1                       # 1..10; simple requires 1; not a concurrency setting.
  # harness2 + parallel: width k references, 2k proposals, k compositions; one round.
  # harness2 + sequential: width references, then rounds contrastive refinement rounds.
  # The parallel pool is currently awaited sequentially; allocations still bound work.

  feedback: auto                 # Choices: auto | behavior | scored.
  # auto: official/pack/editor measurements when available; otherwise behavior.
  # behavior: model compares evidence; no numerical goal is implied.
  # scored: needs a measurement source; editor source requires scored (auto resolves it).
  scope: task                    # Choices: task | persistent.
  # task: select for this search; does not change baseline/daily profiles.
  # persistent: independent verification + pending adoption, not automatic activation.
  # Current TB development reward alone cannot support persistent scope or RSI.
  direction: ""                  # Optional user guidance, at most 2000 characters.
  retain_experience: false        # true requests reflection; does not auto-commit lessons.
  # Native host stages lessons for review; Eval/editor sources do not retain them.

  max_model_calls: 256            # 1..10000; entire search, including editor and checks.
  max_executions: 16              # 1..1000; all leaf executions, including nested checks.
  operation_timeout: 1200         # Seconds per awaited operation; >0, at most 14400.
  timeout_seconds: 3600           # >0 seconds; standalone Improvement root deadline.
  # Allowances are not predicted usage. Verification reserves part of them.
  # TB: budget at least 2 * task.model_calls + 8 for baseline/candidate/selection.
  # More rounds/process judgments need more allowance; changing rounds does not enlarge it.
  # Counts cover harness Provider requests, not SDK retries or shell HTTP requests.
  # No YAML monetary/token budget, retry policy or random-seed control is exposed.

process_assessment:
  assessors: []                   # Default disabled; choices below, may combine.
  # - execution-facts-v1          # Programmatic counters/termination, no inferred quality.
  # - completed-model-v1          # Read-only model judgments + exploration comparison.
  # To enable both, replace [] with [execution-facts-v1, completed-model-v1].
  # Reads completed execution facts and granted evidence; no live task changes.
  # Full input above 2 MB is unavailable, not silently summarized/truncated.
  max_model_calls: 16             # 0..10000 per search; INSIDE the root allocation.
  # Shared by all process judgments and seed comparisons; model assessor needs >0.
  # Nested searches get their own sublimit and still charge the same root ledger.
  timeout_seconds: 120            # Positive finite seconds per assessment/comparison.
  required: false                # true stops on unavailable evidence/judgment/comparison.
  # required: true needs at least one assessor. Root exhaustion/cancellation propagate.
  # Uses models.assessor; official benchmark/private verification remain independent.

exploration:
  policy: incumbent              # Choices: incumbent | process-guided.
  # incumbent: next proposal starts from the official selected harness.
  # process-guided: choose an existing completed seed using process evidence.
  # Requires a comparison-capable assessor (built-in: completed-model-v1).
  # Optional comparison failure keeps incumbent; required failure stops search.
  # Called only when another round will run. Does not change final winner/adoption.

# Read only by rsi. Declaring this block does not enable RSI.
# Native RSI needs independent holdout; editor RSI needs independent episodes.
# Current Eval CLI has no independent adoption verifier, so TB RSI rejects.
rsi:
  max_generations: 3             # Positive integer; cross-generation limit.
  max_model_calls: 768           # Positive integer; shared across all generations.
  max_executions: 64             # Positive integer; all leaf executions across generations.
  timeout_seconds: 10800         # >0 seconds; root deadline, retained across resume.
  phase_timeout: 3600            # >0 seconds per proposal/verification/adoption phase.
  continue_on_rejection: false   # true continues on rejection within remaining limits.
  policy: auto                  # Choices: auto | task-holdout-v1 | improver-paired-v1.
  # Explicit policy must match source: files+holdout -> task-holdout-v1;
  # editor -> improver-paired-v1. auto chooses the source's independent policy.
  # Per-search calls/executions still use improvement limits inside this root.
  # Verified adoption changes the next generation's experiment runtime copy.

stop:
  improvement: null              # null keeps built-in bounded stopping.
  rsi: null                      # null keeps driver limits/rejection behavior.
  # Custom mappings REPLACE the default search policy. Round/generation caps,
  # root budgets, deadlines and cancellation always remain effective.
  # Default search also handles generator stop, repetition and no candidates.
  # Custom policies do not inherit generator-stop/repetition checks; an empty
  # candidate pool still ends search. Conditions run at round/generation boundaries,
  # not before the first candidate or as an in-flight task interruption.

  # Recipe A: replace improvement: null with this mapping (any = OR).
  # improvement:
  #   any:
  #     - {type: iterations, limit: 3}
  #     - {type: no_improvement, patience: 2}
  # no_improvement counts unchanged selected versions, not statistical convergence.
  # A stop limit above improvement.rounds cannot extend the declared search.

  # Recipe B: score goal; needs scored feedback and this exact measurement ID.
  # improvement:
  #   type: score
  #   policy_id: official-benchmark-reward-v1
  #   threshold: 1.0
  #   assurance: selected          # Choices: selected | verified; default is verified.
  # Search has selected assurance; verified cannot trigger before final verification.
  # Other IDs: improver-development-v1 for editor development; packs declare
  # objective.policy_id. This policy compares score >= threshold only.

  # Recipe C: resource threshold at round boundaries; choose ONE resource.
  # improvement:
  #   type: resource
  #   resource: model_calls        # Choices: model_calls | executions | elapsed_seconds.
  #   limit: 200                   # Positive finite number; not a hard in-flight cap.

  # Recipe D: replace rsi: null to stop after two unchanged generations.
  # rsi:
  #   type: no_improvement
  #   patience: 2
  # Rejection also stops by default; continuing needs continue_on_rejection: true.
  # iterations/resource also work for RSI; score needs a verifier-supplied score.
  # Default built-in proof reuse supplies no score; do not assume a score goal.

  # Conditions may nest: any = OR; all = AND. Both need nonempty lists.
  # Example, replacing improvement: null:
  # improvement:
  #   all:
  #     - {type: iterations, limit: 2}
  #     - any:
  #         - {type: no_improvement, patience: 1}
  #         - {type: resource, resource: executions, limit: 8}

  # Recipe E: consecutive execution failures, supported by ordinary search.
  # Zero reward is not a failure; a completed execution resets this counter.
  # Persistent RSI rejection is not a counted failure.
  # improvement:
  #   type: failures
  #   limit: 2                     # Positive integer.
  # Recipe F: final completed-process metric; enable the named assessor above.
  # improvement:
  #   type: metric
  #   assessor_id: execution-facts-v1
  #   metric: tool_errors
  #   threshold: 3
  #   direction: max               # Choices: max (>=) | min (<=).
  #   scope: execution             # Exact scope; requires a final assessment.
  # Facts metrics: provider_attempts, provider_failures, tool_requests, tool_attempts,
  # tool_started, tool_errors, tool_denied, tool_budget_skipped, tool_output_skipped,
  # and <resource>_<scope> budget usage (for example model_calls_execution).
  # Other registered assessors define their own metrics. Counts are not quality.
  # Unknown/provisional values cannot meet goals. Standard persistent RSI generation
  # state does not provide completed-process metrics. Online metrics remain separate.

# ALTERNATIVE SOURCES: replace task above; do not merge incompatible fields.
# Native files: no Bash/network/live Session; input paths must stay in workspace.
# task:
#   source: files
#   instruction: Produce a concise inventory of the supplied material.
#   input_paths: []               # Optional file paths relative to this YAML.
#   parameters:
#     assessment_interval: 0      # 0..1000 events; 0 disables online process assessment.
# Native pack: owns instruction/files; omit instruction/input_paths.
# task:
#   source: files
#   pack: your-installed-pack      # Placeholder ID in .fruitfly/improvement/task-packs/.
#   parameters:
#     assessment_interval: 0
# Scorer, splits, expected answers and direction belong to pack.json/case files,
# not editable candidates. See fruitfly_agent/lab/improvement/tasks/README.md.

# Editor/I: installed material is not supplied by this template.
# Also set improvement.components: [improvement-editor], feedback: auto or scored,
# max_model_calls: 512, max_executions: 256 (or larger, as material checks require).
# Explicit search limits above override source defaults when switching sources.
# task:
#   source: editor
#   material: editor-study         # .fruitfly/improvement/experiments/<id>/experiment.json.
#   parameters:
#     inner_strategy: simple       # Choices: simple | harness2.
#     inner_components: base_prompt # Space-separated H/S IDs; no inner I changes.
#     repetitions: 2               # 2..10 paired fresh episodes per package.
#     inner_depth: 1               # 1..3 inner refinement rounds.
#     inner_model_calls: 12        # 4..1000 per inner search, inside the same root.
#     inner_executions: 4          # 4..100 leaf executions per inner search.
#     evaluation_model_calls: 1    # 1..32 per private evaluation.
#     max_trials: 8                # 1..40 development trials, including baseline trials.
#     min_gain: 0.0                # 0..1; paired mean gain must strictly exceed this.
#     max_regression: 0.0          # 0..1 allowed per-case/paired regression.
#     max_model_ratio: 1.5         # 0.1..10 candidate/old-editor model-call ratio.
# Material owns development/verification pack IDs and max_verifications
# (1..10 private-suite uses), separately from this run configuration.

# OTHER OWNERS: edit referenced files, rather than inventing experiment fields.
# default-config.yaml: executor/profile, mechanisms, prompt/artifact bindings,
# execution: tool/turn/recovery limits and tool scheduling; see the default-config template,
# mechanism parameters (including initial S documents and size limits).
# Tool allowance is per outer task turn, not task.model_calls or editor's 48-tool bound.
# default-models.yaml: Provider, remote model, endpoint, capabilities, context/output
# limits, api_key_env and parameters (request/retry/deadline options).
# Credentials stay in secrets.env/process environment.
# request.json: benchmark/variant, attempts, concurrency, task execution timeout.
# host.yaml: runtime/mounts, task patches, dependencies, environments and caches.
# CLI: --cwd, --config, --json, --events jsonl, operation/action and run ID.
# No experiment field chooses arbitrary output roots or enables a subagent mechanism.
# Custom components, strategies, assessors, aggregation, feedback/control and verifiers
# need public Python registration/injection; no arbitrary import paths in YAML.
# Guides: examples/experiments/README.md and fruitfly_agent/experiments/README.md.
