id: compaction
role: H
implementation: compaction
enabled: true
parameters:
  enabled: true
  reserve_tokens: 1024
  keep_recent_tokens: 20000
  reactive_keep_recent_tokens: 10000
  max_shrink_steps: 5
  summary_word_limit: 400
  summary_max_tokens: 2048
  history_char_limit: 120000
  per_message_char_limit: 120000
  summary_attempts: 2
  summary_timeout_seconds: 60.0
  token_estimator: heuristic_cjk
  prompt_version: continuity
  summary_instructions: Preserve the original task, user corrections, constraints,
    decisions, completed work, failures, unresolved work and the next action. Distinguish
    verified results from guesses. Merge previous memory with this evidence page.
    Add no invented information.
  trigger_ratio: 0.9
  max_pages: 64
