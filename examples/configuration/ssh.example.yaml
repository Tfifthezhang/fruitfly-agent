default_profile: remote
profiles:
  remote:
    models:
      catalog: models.yaml
      roles:
        executor: deepseek-flash-openai
    H:
      ssh-env:
        inline:
          id: ssh-env
          implementation: ssh-env
          role: H
          enabled: true
          parameters:
            host: server.example
            port: 2222
            cwd: /srv/workspace
            username_env: FRUITFLY_SSH_USERNAME
            password_env: FRUITFLY_SSH_PASSWORD
            known_hosts: ~/.ssh/known_hosts
      read-tool:
        inline:
          id: read-tool
          implementation: read-tool
          role: H
          enabled: true
          parameters: {}
      write-tool:
        inline:
          id: write-tool
          implementation: write-tool
          role: H
          enabled: true
          parameters: {}
      edit-tool:
        inline:
          id: edit-tool
          implementation: edit-tool
          role: H
          enabled: true
          parameters: {}
      bash-tool:
        inline:
          id: bash-tool
          implementation: bash-tool
          role: H
          enabled: true
          parameters: {}
    S: {}
    I: {}
