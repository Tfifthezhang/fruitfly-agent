# Copy only when .fruitfly/config.yaml is absent, or merge the SSH settings
# into an existing profile. Fill secrets in .fruitfly/secrets.env, never here.
# Requires pip install -e '.[ssh]', a verified known_hosts entry, and an existing
# POSIX server directory with SFTP, python3 and /bin/bash available.
# Starting this profile connects to the configured SSH server; model tasks also
# contact the selected model service and may incur charges.
schema_version: 1
default_profile: remote
profiles:
  remote:
    model:
      catalog: models.yaml
      profile: deepseek-flash-openai
    mechanisms:
      - id: ssh-env
        enabled: true
        parameters:
          host: server.example
          port: 2222
          cwd: /srv/workspace
          username_env: FRUITFLY_SSH_USERNAME
          password_env: FRUITFLY_SSH_PASSWORD
          known_hosts: ~/.ssh/known_hosts
      - id: read-tool
      - id: write-tool
      - id: edit-tool
      - id: bash-tool
