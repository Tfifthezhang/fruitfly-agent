[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fruitfly-agent"
version = "0.1"
description = "An interactive-first Python harness with a stable core and pluggable agent algorithms."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "anthropic>=1.12.0",
    "ipython>=8.18",
    "markdown-it-py>=3.0",
    "openai>=3.26.0",
    "Pygments>=2.17",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
    "jsonschema>=4.23,<5",
]
ssh = [
    "paramiko>=3.4,<5",
]
dev = [
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]
benchmarks = [
    "harbor==0.23.0",
]

[project.scripts]
fruitfly-agent = "fruitfly_agent.run:main"
fruitfly-agent-eval = "eval.__main__:main"
fruitfly-agent-lab = "fruitfly_agent.experiments.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fruitfly_agent*", "eval*"]

[tool.setuptools.package-data]
"fruitfly_agent.experiments" = ["templates/*.yaml", "templates/tasks/*.yaml"]
"fruitfly_agent.run.configuration" = ["templates/*.yaml", "templates/components/H/*.yaml", "templates/components/H/tools/*.yaml", "templates/components/S/*.yaml", "templates/components/I/*.yaml"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
files = [
    "fruitfly_agent/runtime_spec",
    "fruitfly_agent/lab/execution_policy",
    "fruitfly_agent/lab/catalog/components.py",
    "fruitfly_agent/lab/catalog/tool_providers.py",
    "fruitfly_agent/lab/mcp",
    "fruitfly_agent/run/runtime/tool_providers.py",
    "fruitfly_agent/interactive/contracts/tool_services.py",
    "fruitfly_agent/core/tool_runtime/authorization.py",
    "fruitfly_agent/interactive/interaction/authorization.py",
    "fruitfly_agent/lab/environment/permissions.py",
    "fruitfly_agent/lab/environment/execution.py",
    "fruitfly_agent/lab/environment/guarded.py",
    "fruitfly_agent/lab/catalog/permissions.py",
    "fruitfly_agent/run/runtime/permissions.py",
    "fruitfly_agent/core/config.py",
    "fruitfly_agent/core/loop.py",
    "fruitfly_agent/core/extensions/callbacks.py",
    "fruitfly_agent/core/extensions/protocols.py",
    "fruitfly_agent/core/session/storage.py",
    "fruitfly_agent/core/tool_runtime/__init__.py",
    "fruitfly_agent/core/tool_runtime/execution.py",
    "fruitfly_agent/interactive/application/application.py",
    "fruitfly_agent/interactive/application/runtime.py",
    "fruitfly_agent/interactive/contracts/runtime.py",
    "fruitfly_agent/interactive/contracts/commands.py",
    "fruitfly_agent/interactive/contracts/events.py",
    "fruitfly_agent/interactive/contracts/configuration.py",
    "fruitfly_agent/interactive/contracts/improvement.py",
    "fruitfly_agent/interactive/contracts/experience.py",
    "fruitfly_agent/interactive/contracts/candidates.py",
    "fruitfly_agent/interactive/contracts/task_packs.py",
    "fruitfly_agent/interactive/application/jobs.py",
    "fruitfly_agent/interactive/session/materials.py",
    "fruitfly_agent/interactive/terminal/commands.py",
    "fruitfly_agent/interactive/terminal/bindings.py",
    "fruitfly_agent/run/application.py",
    "fruitfly_agent/run/cli.py",
    "fruitfly_agent/run/configuration/resolution.py",
    "fruitfly_agent/run/configuration/views.py",
    "fruitfly_agent/run/configuration/controller.py",
    "fruitfly_agent/run/runtime/recovery.py",
    "fruitfly_agent/run/improvement/versions.py",
    "fruitfly_agent/lab/algorithms/snapshots.py",
    "fruitfly_agent/lab/improvement",
    "fruitfly_agent/lab/rsi",
    "fruitfly_agent/experiments",
    "fruitfly_agent/run/runtime/limits.py",
    "fruitfly_agent/run/evolution.py",
    "fruitfly_agent/run/improvement/evolution.py",
    "fruitfly_agent/run/improvement/pipeline.py",
    "fruitfly_agent/interactive/terminal/io/live.py",
    "fruitfly_agent/interactive/terminal/io/display.py",
    "fruitfly_agent/interactive/terminal/io/editor.py",
    "fruitfly_agent/interactive/terminal/io/controls.py",
    "fruitfly_agent/interactive/terminal/io/completion.py",
