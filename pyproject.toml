[[tool.mypy.overrides]]
module = [
    "fruitfly_agent.core.loop",
    "fruitfly_agent.lab.improvement.tasks",
    "fruitfly_agent.lab.improvement.tasks.scoring",
    "fruitfly_agent.lab.improvement.assessment.scorers.policies",
    "fruitfly_agent.interactive.terminal.io.live",
    "fruitfly_agent.interactive.terminal.io.display",
    "fruitfly_agent.interactive.terminal.io.editor",
    "fruitfly_agent.interactive.terminal.io.controls",
    "fruitfly_agent.interactive.terminal.io.completion",
    "fruitfly_agent.interactive.terminal.commands",
    "fruitfly_agent.interactive.interaction.commands",
    "fruitfly_agent.interactive.terminal.io.screen",
    "fruitfly_agent.interactive.terminal.io.secret",
    "fruitfly_agent.interactive.terminal.features.configuration.forms",
    "fruitfly_agent.interactive.terminal.io.menu",
    "fruitfly_agent.interactive.terminal.features.configuration.menu",
    "fruitfly_agent.providers.openai_codec",
    "fruitfly_agent.providers.anthropic_codec",
    "fruitfly_agent.run.adapters.runtime",
    "eval.benchmarks.harbor",
]
disallow_untyped_defs = true

# Harbor 0.23.0 contains inline annotations but does not publish a py.typed marker.
# Read its source when installed; optional-import guards still cover its absence.
[[tool.mypy.overrides]]
module = ["harbor.*"]
follow_untyped_imports = true

# Optional SDK/schema boundaries remain dynamically typed when the extra is absent.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
