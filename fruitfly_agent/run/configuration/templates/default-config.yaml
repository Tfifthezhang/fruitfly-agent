        editor:
          inherit: executor
        assessor:
          inherit: executor
        working_memory:
          inherit: executor
        context_query:
          inherit: executor
        context_summary:
          inherit: executor
    H:
      local-env:
        default: true
      read-tool:
        default: true
      bash-tool:
        default: true
      edit-tool:
        default: true
      write-tool:
        default: true
      tool-catalog:
