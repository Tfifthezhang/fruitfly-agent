# Copy to .fruitfly/default-models.yaml and verify model settings before live use.
# Key values belong in the secret environment; this may share DEEPSEEK_API_KEY with daily use.
models:
  deepseek-flash-openai:
    provider: openai
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    context_window: 1000000
    max_output_tokens: 4096
    capabilities:
      tools: true
      parallel_tool_calls: false
      vision: false
      reasoning: false
      streaming: true
    parameters:
      first_progress_timeout: 180
      stall_timeout: 180
      total_timeout: 900
      retry_max: 3
      reasoning:
        effort: none
