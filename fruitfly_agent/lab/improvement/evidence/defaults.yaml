# Shared evidence defaults. Types and hard safety limits remain in Python.
parameters:
  findings:
    max_characters: 256000
    summary_characters: 6000
  read:
    default_characters: 12000
    max_characters: 24000
  catalog:
    default_entries: 50
    max_entries: 100
  search:
    default_matches: 20
    max_matches: 50
    max_characters: 12000
  supply:
    max_characters: 256000
    max_pages: 64
    completion_requests: 32
    repeated_error_limit: 3
  delegation:
    enabled: false
    workers:
    - evidence-reader
  instructions:
    save_findings: Save one validated detailed findings block before final submission. Each block uses the findings schema and result size limit. Final submit_findings retains these blocks and returns a compact summary.
    initial: Use catalog to discover the granted workspace, then read relevant evidence.
    repair: 'The judgment was rejected: {error}. Repair the submission using the declared
      schema and supplied citations. Do not restart investigation or invent evidence.'
    catalog: Use kind=executions to page complete compact execution rows, optionally filtering status. Browse granted files with prefix. Use path only for a granted evidence/events.json index, never an execution directory. Catalog is navigation, not proof of reading.
    read: Read a granted original page or image. Cite the returned citation_id; continue
      with next_offset. Offsets are source characters.
    search: Literal search across granted files or selected paths. Returns source
      spans, citation IDs, failures and a continuation cursor.
    submit_findings: Submit a short final conclusion, references to saved detailed blocks, exact supplied citations and remaining
      unknowns. Success terminates this child invocation. Do not use this tool for probes
      or progress updates. Run this tool alone in its batch. If rejected, repair only the reported fields.
    catalog_parts: Browse still-applicable retained child findings without supplying original evidence.
    read_part: Read a retained part with original producer and source references. Continue with next_offset; this is derived historical evidence.
  retention:
    enabled: false
    reuse: true
    preview_characters: 400
