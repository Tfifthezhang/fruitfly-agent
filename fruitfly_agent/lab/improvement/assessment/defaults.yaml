id: improvement-evaluator
role: I
implementation: improvement-evaluator
parameters:
  instructions:
    criteria: 'Derive concrete task-specific criteria for these dimensions when applicable:
      task quality (correctness, completeness and constraints); execution reliability
      (failures, repeated errors and recovery); resource efficiency (reported tokens,
      cache, model/tool/wait time); progress efficiency (useful steps, repetition
      and rework); verification and evidence quality (valid checks, hidden command
      failures, source support); completion efficiency (value of actions after sufficient
      completion evidence). A saturated outcome score still permits process improvement.
      Action counts alone are not quality. Distinguish installed candidate changes
      from observed behavioral improvements. Missing facts are unknown.'
    assess: Inspect the overview and event catalog, then search and read relevant
      original spans. Judge each applicable dimension with reasons, uncertainty and
      precise citations. A successful tool status does not establish success of every
      enclosed command. Explain observed process signals and concrete next modification
      hypotheses, including evidence that would refute them. Check supplied expected
      effects against behavior; do not infer causation from one run. Distinguish infrastructure
      failures from task failures. Do not invent a total numeric score or unreported
      cost.
    compare: Compare existing runs with identical dimensions and criteria. Respect
      official measurements and fixed regression requirements. Prioritize task quality
      and reliability before efficiency. When quality is supported as equal, consider
      resource, progress and completion efficiency with uncertainty. Fewer model calls
      do not establish lower token use or elapsed time. Explain tradeoffs, hypothesis
      outcomes and next optimization directions with source citations. Retain the
      incumbent or report no clear choice when evidence is insufficient. Selection
      does not grant independent adoption.
