research:
  id: benchmark-research
  title: Fixed benchmark and independent Improvement stages
  output_root: research-output
  branch: main
baseline:
  config: default-config.yaml
  profile: baseline
roles: {}
overrides: {}
optimization:
  scope: defaults
  include: {}
  exclude: []
stages:
  execute:
    tasks:
      file: tasks/tb4-smoke.yaml
    task_seconds: 3600
    concurrency: 1
    attempts: 1
  organize:
    timeout_seconds: 1200
  assess:
    timeout_seconds: 1200
  propose:
    timeout_seconds: 1200
    generator: agent-editor-v1
  compare:
    timeout_seconds: 1200
evidence:
  read:
    default_characters: 12000
    max_characters: 24000
  catalog:
    default_entries: 50
    max_entries: 100
  search:
    default_matches: 20
    max_matches: 50
    max_characters: 12000
next:
  stage: execute
  publish_as: baseline-results
  inputs:
    harness:
      config: default-config.yaml
  attempt: reuse
