<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">Compose your FruitFlyAgent harness</title>
  <desc id="description">Select a model and base prompt, then configure context management, environment, tools, and optimization for a new Agent session. RLM-inspired externalization and IPython are optional mechanisms. This is a composition diagram, not an execution sequence or default configuration.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef3f5"/>
    </linearGradient>
    <linearGradient id="runtime" x2="1" y2="1">
      <stop stop-color="#19384f"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 8 5 1 9" fill="none" stroke="#91a5b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #657b8b; }
      .heading { font-size: 21px; font-weight: 650; fill: #18344a; }
      .body { font-size: 16px; fill: #607586; }
      .chip { font-size: 14px; font-weight: 600; }
      .card { fill: #fff; stroke: #dbe4e9; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1200" height="660" rx="24" fill="url(#canvas)"/>
  <rect x="44" y="40" width="36" height="5" rx="2.5" fill="#cc9046"/>
  <text x="44" y="88" font-size="32" font-weight="700" fill="#18344a">Compose your harness.</text>
  <text x="44" y="120" font-size="18" fill="#607586">A Python runtime with composable research mechanisms.</text>
  <rect x="966" y="54" width="190" height="36" rx="18" fill="#e6edf1"/>
  <text x="1061" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#38566b">FruitFlyAgent</text>

  <text x="44" y="170" class="section">SELECT</text>
  <text x="320" y="170" class="section">CONFIGURE MECHANISMS</text>
  <text x="950" y="170" class="section">ASSEMBLE</text>

  <rect x="44" y="190" width="230" height="310" rx="18" class="card"/>
  <g fill="none" stroke="#cc9046" stroke-width="2" stroke-linecap="round">
    <rect x="66" y="215" width="24" height="24" rx="6"/>
    <path d="M72 227h12m-6-6v12"/>
  </g>
  <text x="66" y="273" class="heading">Model</text>
  <text x="66" y="301" class="body">Your API and profile</text>
  <path d="M66 329H252" stroke="#e7edf1"/>
  <g fill="none" stroke="#cc9046" stroke-width="2" stroke-linecap="round">
    <path d="M69 356h18m-18 7h18m-18 7h11"/>
  </g>
  <text x="66" y="408" class="heading">Base prompt</text>
  <text x="66" y="436" class="body">Built-in or custom text</text>
  <text x="66" y="473" font-size="13" fill="#8495a1">Choices for your experiment</text>

  <path d="M285 345H308" fill="none" stroke="#91a5b5" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="190" width="258" height="145" rx="18" class="card"/>
  <rect x="340" y="211" width="4" height="23" rx="2" fill="#468a87"/>
  <text x="355" y="229" class="heading">Context</text>
  <text x="340" y="262" class="body">Memory · summarization</text>
  <rect x="340" y="282" width="170" height="30" rx="15" fill="#e8f4f1"/>
  <text x="355" y="302" class="chip" fill="#347773">RLM-inspired · optional</text>

  <rect x="600" y="190" width="258" height="145" rx="18" class="card"/>
  <rect x="620" y="211" width="4" height="23" rx="2" fill="#6d85af"/>
  <text x="635" y="229" class="heading">Environment</text>
  <text x="620" y="262" class="body">Local workspace</text>
  <text x="620" y="302" class="body">Files and process access</text>

  <rect x="320" y="355" width="258" height="145" rx="18" class="card"/>
  <rect x="340" y="376" width="4" height="23" rx="2" fill="#6d85af"/>
  <text x="355" y="394" class="heading">Tools</text>
  <text x="340" y="427" class="body">Read · write · edit · Bash</text>
  <rect x="340" y="447" width="149" height="30" rx="15" fill="#edf1f8"/>
  <text x="355" y="467" class="chip" fill="#56729b">IPython · optional</text>

  <rect x="600" y="355" width="258" height="145" rx="18" class="card"/>
  <rect x="620" y="376" width="4" height="23" rx="2" fill="#cc9046"/>
  <text x="635" y="394" class="heading">Optimization</text>
  <text x="620" y="427" class="body">OPRO text search</text>
  <rect x="620" y="447" width="92" height="30" rx="15" fill="#faf0df"/>
  <text x="635" y="467" class="chip" fill="#9b6b2e">Optional</text>

  <path d="M875 345H933" fill="none" stroke="#91a5b5" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="950" y="190" width="206" height="310" rx="18" fill="url(#runtime)"/>
  <g transform="translate(1053 270)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="32" stroke="#3a586b" stroke-width="1.5"/>
    <path d="M-15-7a17 17 0 0 1 30 0m0 14a17 17 0 0 1-30 0" stroke="#ecc58a" stroke-width="2.5"/>
    <path d="m10-8 6 2 2-6m-28 20-6-2-2 6" stroke="#ecc58a" stroke-width="2.5"/>
  </g>
  <text x="1053" y="340" text-anchor="middle" font-size="23" font-weight="650" fill="#fff">Agent runtime</text>
  <text x="1053" y="371" text-anchor="middle" font-size="16" fill="#b9ccd9">Stable Core</text>
  <text x="1053" y="397" text-anchor="middle" font-size="16" fill="#b9ccd9">Selected Lab mechanisms</text>
  <rect x="976" y="434" width="154" height="34" rx="17" fill="#29495c"/>
  <text x="1053" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#e8f0f5">New session</text>

  <rect x="44" y="538" width="1112" height="72" rx="16" fill="#fff" stroke="#dbe4e9"/>
  <g font-size="15" font-weight="600">
    <circle cx="78" cy="574" r="15" fill="#e8f4f1"/>
    <text x="78" y="579" text-anchor="middle" fill="#347773">1</text>
    <text x="105" y="579" fill="#38566b">Enable the mechanisms you need</text>
    <circle cx="462" cy="574" r="15" fill="#edf1f8"/>
    <text x="462" y="579" text-anchor="middle" fill="#56729b">2</text>
    <text x="489" y="579" fill="#38566b">Choose registered algorithms</text>
    <circle cx="833" cy="574" r="15" fill="#faf0df"/>
    <text x="833" y="579" text-anchor="middle" fill="#9b6b2e">3</text>
    <text x="860" y="579" fill="#38566b">Save and start a new session</text>
  </g>
  <text x="600" y="639" text-anchor="middle" font-size="13" fill="#718594">Composition overview · RLM-inspired externalization requires the IPython tool · Detailed parameters live in YAML</text>
</svg>
