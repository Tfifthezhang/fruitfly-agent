<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
<title id="title">FruitFlyAgent grouped and inline terminal menus</title>
<desc id="description">Two illustrative terminal views. Context augmentation contains Skill catalog, File memory, Local knowledge and Live HTTP information. Externalization and reduction have separate headings on the same page. The Improvement panel expands Target into object, algorithm and parameter choices before Task, Budget and Evaluation. Cyan indicates focus, green indicates enabled or selected, and yellow indicates a draft change. These are example selections, not defaults.</desc>
<style>
text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 16px; fill: #dce7f0; }
.muted { fill: #a3b3c2; font-size: 14px; }
.focus { fill: #88f1ec; font-weight: 700; }
.enabled { fill: #9ce1ae; }
.section { fill: #a7bfff; font-weight: 700; }
.changed { fill: #f1ce7c; }
.heading { font-size: 22px; font-weight: 700; }
</style>
<rect width="1200" height="820" rx="20" fill="#091522"/>
<text x="44" y="48" class="heading">Choose the object. Expand its options. Edit in place.</text>
<text x="44" y="79" class="muted">Readable names, clear responsibilities, and visible input on one menu surface.</text>
<rect x="44" y="108" width="536" height="632" rx="12" fill="#0d2236" stroke="#284157"/>
<rect x="620" y="108" width="536" height="632" rx="12" fill="#0d2236" stroke="#284157"/>
<text x="66" y="148" class="heading">Context</text>
<text x="66" y="178" class="muted">Changes apply to the next session.</text>
<text x="66" y="219" class="section">Context augmentation</text>
<text x="80" y="251" xml:space="preserve"><tspan class="enabled">[✓]</tspan> Skill catalog · Enabled ▾</text>
<text x="80" y="283" xml:space="preserve"><tspan class="enabled">[✓]</tspan> File memory · Enabled ▾</text>
<text x="80" y="315" xml:space="preserve">[ ] Local knowledge · Disabled ▾</text>
<text x="80" y="347" xml:space="preserve">[ ] Live HTTP information · Disabled ▾</text>
<text x="66" y="391" class="section">Context externalization</text>
<text x="80" y="423" xml:space="preserve">[ ] Externalization · Disabled ▾</text>
<text x="66" y="467" class="section">Context reduction</text>
<rect x="58" y="482" width="506" height="32" rx="4" fill="#263b4f"/>
<text x="66" y="504" class="focus" xml:space="preserve">❯ <tspan class="enabled">[✓]</tspan> Reduction · Summarizing ▴</text>
<text x="104" y="537">Implementation · Summarizing</text>
<text x="104" y="564" class="muted">Summarize older conversation context.</text>
<text x="104" y="596" class="muted">Parameters and implementation details …</text>
<text x="80" y="650">Back</text>
<text x="66" y="704" class="muted">Enter expand · Space enable/disable · Esc back</text>
<text x="642" y="148" class="heading">Improvement · Experiment</text>
<text x="642" y="178" class="muted">Review settings before starting one experiment.</text>
<text x="642" y="219">Target · Base prompt · OPRO ▴ <tspan class="changed">· Modified</tspan></text>
<text x="666" y="252" class="section">Targets · H</text>
<text x="680" y="282" xml:space="preserve"><tspan class="enabled">●</tspan> Base prompt</text>
<text x="680" y="311">○ Skill catalog guidance</text>
<text x="666" y="346" class="section">Algorithms</text>
<text x="680" y="376" xml:space="preserve"><tspan class="enabled">●</tspan> OPRO</text>
<text x="680" y="405">○ Tree search</text>
<rect x="634" y="421" width="506" height="31" rx="4" fill="#263b4f"/>
<text x="642" y="443" class="focus" xml:space="preserve">❯   Search rounds · 2</text>
<text x="680" y="475" class="muted">Proposal batch · 2</text>
<text x="642" y="516">Task · Python function pack ▾</text>
<text x="642" y="548">Budget · 64 model / 32 trial calls ▾</text>
<text x="642" y="580">Evaluation · Function tests ▾</text>
<text x="642" y="615">Start improvement · Results and history</text>
<path d="M642 637H1134" stroke="#284157"/>
<text x="642" y="661" class="focus">Search rounds</text>
<text x="642" y="686" class="muted">Current: 2 · integer · range 1–20</text>
<text x="642" y="716" class="focus">❯ 3</text>
<text x="44" y="776" class="muted">Examples, not defaults. Symbols retain state without color; line input retains numbered actions.</text>
<text x="44" y="800" class="muted">Configuration and previews make no model requests. Improvement starts only after explicit confirmation.</text>
</svg>
